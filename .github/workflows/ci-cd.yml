name: CI Pipeline

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Check project files
        run: |
          ls -la
          ls -la src

      - name: Build Docker image
        run: |
          docker build -t task-manager:ci .

      - name: CI success
        run: |
          echo "CI Pipeline Completed Successfully"